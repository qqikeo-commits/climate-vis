<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全球地表气温百年时空演进与极地放大效应交互可视化平台</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js"></script>
  <style>
    :root {
      --bg-deep: #050914;
      --bg-panel: rgba(12, 22, 44, 0.72);
      --border-glow: rgba(56, 189, 248, 0.28);
      --neon-cyan: #38bdf8;
      --neon-rose: #f43f5e;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; height: 100vh; display: flex;
    }
    aside { width: 268px; background: #091122; border-right: 1px solid var(--border-glow); display: flex; flex-direction: column; z-index: 30; }
    .brand { height: 70px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid rgba(56, 189, 248, 0.15); }
    .brand-logo { width: 36px; height: 36px; background: linear-gradient(135deg, #0284c7, #f43f5e); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; }
    .brand-text h1 { font-size: 14.5px; color: #fff; }
    .brand-text p { font-size: 10.5px; color: var(--text-secondary); }
    nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; }
    .nav-item { display: flex; align-items: center; gap: 11px; padding: 11px 14px; border-radius: 8px; color: var(--text-secondary); cursor: pointer; font-size: 13px; }
    .nav-item:hover, .nav-item.active { background: rgba(56, 189, 248, 0.2); color: #fff; }
    .app-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    header { height: 70px; background: rgba(8, 15, 32, 0.85); border-bottom: 1px solid var(--border-glow); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
    .header-title { font-size: 16.5px; font-weight: 700; color: #f8fafc; }
    .view-container { flex: 1; padding: 16px; position: relative; overflow: hidden; }
    .page-view { position: absolute; top: 16px; left: 16px; right: 16px; bottom: 16px; display: none; gap: 16px; }
    .page-view.active { display: flex; }
    .panel { flex: 1; background: var(--bg-panel); border: 1px solid var(--border-glow); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; }
    .panel-title { font-size: 13.5px; font-weight: 700; color: #e2e8f0; margin-bottom: 8px; }
    .chart-box { flex: 1; width: 100%; height: 100%; min-height: 200px; }
  </style>
</head>
<body>

  <aside>
    <div class="brand">
      <div class="brand-logo">TP</div>
      <div class="brand-text">
        <h1>气候时空演化平台</h1>
        <p>多维交互系统</p>
      </div>
    </div>
    <nav>
      <div class="nav-item active" onclick="switchView('page-global', this)">🌍 1. 全球宏观态势</div>
      <div class="nav-item" onclick="switchView('page-map', this)">🗺️ 2. 各国时空演变</div>
      <div class="nav-item" onclick="switchView('page-china', this)">🇨🇳 3. 中国省份响应</div>
      <div class="nav-item" onclick="switchView('page-polar', this)">❄️ 4. 极地放大效应</div>
      <div class="nav-item" onclick="switchView('page-city', this)">🏙️ 5. 核心城市速查</div>
    </nav>
  </aside>

  <div class="app-main">
    <header>
      <div class="header-title" id="currentSectionTitle">模块一：全球海陆宏观气温长周期演变</div>
    </header>

    <div class="view-container">
      <div id="page-global" class="page-view active">
        <div class="panel">
          <div class="panel-title">全球地表气温走势及海陆缓冲对比</div>
          <div id="chart-global" class="chart-box"></div>
        </div>
      </div>
      <div id="page-map" class="page-view">
        <div class="panel">
          <div class="panel-title">全球升温距平地理分布</div>
          <div id="chart-map" class="chart-box"></div>
        </div>
      </div>
      <div id="page-china" class="page-view">
        <div class="panel">
          <div class="panel-title">中国各省份升温幅度排行</div>
          <div id="chart-china" class="chart-box"></div>
        </div>
      </div>
      <div id="page-polar" class="page-view">
        <div class="panel">
          <div class="panel-title">极端升温都市排行</div>
          <div id="chart-top-cities" class="chart-box"></div>
        </div>
      </div>
      <div id="page-city" class="page-view">
        <div class="panel">
          <div class="panel-title">核心城市百年气温速查</div>
          <div id="chart-city-lookup" class="chart-box"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const charts = {};
    const dataStore = {};

    function switchView(pageId, navEl) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      navEl.classList.add('active');
      document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      setTimeout(() => Object.values(charts).forEach(c => c && c.resize()), 50);
    }

    async function initApp() {
      try {
        const ts = '?v=' + Date.now();
        const prefix = window.location.hostname.includes('github.io') ? '/climate-vis/' : './';

        const [gRes, aRes, tRes, sRes, cRes, lRes] = await Promise.all([
          fetch(prefix + 'global_trend.json' + ts),
          fetch(prefix + 'country_anomaly.json' + ts),
          fetch(prefix + 'country_trends.json' + ts),
          fetch(prefix + 'china_states.json' + ts).catch(() => null),
          fetch(prefix + 'top_cities.json' + ts).catch(() => null),
          fetch(prefix + 'city_lookup.json' + ts).catch(() => null)
        ]);

        const gJson = gRes.ok ? await gRes.json() : [];
        dataStore.global = Array.isArray(gJson) ? gJson : (gJson.annual || []);
        dataStore.anomaly = aRes.ok ? await aRes.json() : {};
        dataStore.trends = tRes.ok ? await tRes.json() : {};
        dataStore.chinaStates = (sRes && sRes.ok) ? await sRes.json() : [];
        dataStore.topCities = (cRes && cRes.ok) ? await cRes.json() : [];
        dataStore.cityLookup = (lRes && lRes.ok) ? await lRes.json() : {};

        // 核心渲染
        renderGlobal();
        renderChina();
        renderTopCities();

      } catch (err) {
        console.error("加载异常:", err);
      }
    }

    function renderGlobal() {
      charts.global = echarts.init(document.getElementById('chart-global'), 'dark');
      const d = dataStore.global;
      charts.global.setOption({
        backgroundColor: 'transparent',
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: d.map(x => x.year) },
        yAxis: { type: 'value', min: 'dataMin' },
        series: [{ name: '陆地均温', type: 'line', data: d.map(x => x.land_temp), itemStyle: { color: '#f43f5e' } }]
      });
    }

    function renderChina() {
      charts.china = echarts.init(document.getElementById('chart-china'), 'dark');
      const list = (dataStore.chinaStates.length > 0) ? dataStore.chinaStates.slice(0, 10) : [{State:'北京',rise:2.1},{State:'上海',rise:1.8}];
      charts.china.setOption({
        backgroundColor: 'transparent',
        xAxis: { type: 'value' },
        yAxis: { type: 'category', data: list.map(x => x.State) },
        series: [{ type: 'bar', data: list.map(x => x.rise), itemStyle: { color: '#38bdf8' } }]
      });
    }

    function renderTopCities() {
      charts.topCities = echarts.init(document.getElementById('chart-top-cities'), 'dark');
      const list = (dataStore.topCities.length > 0) ? dataStore.topCities.slice(0, 10) : [{City:'Moscow',temp_rise:2.3}];
      charts.topCities.setOption({
        backgroundColor: 'transparent',
        xAxis: { type: 'value' },
        yAxis: { type: 'category', data: list.map(x => x.City) },
        series: [{ type: 'bar', data: list.map(x => x.temp_rise), itemStyle: { color: '#f43f5e' } }]
      });
    }

    initApp();
  </script>
</body>
</html>
